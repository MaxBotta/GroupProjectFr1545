<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Unsere Lehrer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        /* Header */
        .header {
            background: #045e29; /* Dein grüner Farbton */
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* MOOC Logo – alle Buchstaben verbunden */
        .mooc-logo {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        /* M + OO + C zusammen */
        .mooc-full {
            font-size: 48px;
            color: black;
            letter-spacing: -8px; /* verbindet M, O, O, C */
            font-weight: 900;
        }

        /* Navigation rechts */
        .nav {
            display: flex;
            gap: 25px;
            font-size: 18px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        .nav a {
            color: white;
            text-decoration: none;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-top: 30px;
        }

        p.subtitle {
            text-align: center;
            font-size: 18px;
            color: #555;
            margin-bottom: 40px;
        }

        .teacher-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            padding-bottom: 40px;
        }

        .teacher-card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .teacher-card:hover {
            transform: scale(1.05);
        }

        .teacher-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .teacher-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<!-- Header mit MOOC Logo + Navigation -->
<div class="header">

    <!-- MOOC Logo 1:1 wie dein Bild -->
    <div class="mooc-logo">
        <span class="mooc-full">MOOC</span>
    </div>

    <div class="nav">
        <a href="#">Über Uns</a>
        <a href="#">Kurse</a>
        <a href="#">Kalender</a>
        <a href="#">Lehrer</a>
        <a href="#">Kontakt</a>
    </div>
</div>

<h1>Unsere Lehrer</h1>
<p class="subtitle">Lerne unsere Lehrer kennen – Hier stellen wir Ihnen unser Lehrerteam vor</p>

<div class="teacher-container">

    <div class="teacher-card">
        <img src="https://images.unsplash.com/photo-1595152772835-219674b2a8a6?auto=format&fit=crop&w=400&q=80" alt="Max Mustermann">
        <div class="teacher-name">Max Mustermann</div>
    </div>

    <div class="teacher-card">
        <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=400&q=80" alt="Maria Musterfrau">
        <div class="teacher-name">Maria Musterfrau</div>
    </div>

    <div class="teacher-card">
        <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?auto=format&fit=crop&w=400&q=80" alt="John Doe">
        <div class="teacher-name">John Doe</div>
    </div>

    <div class="teacher-card">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=400&q=80" alt="Jane Smith">
        <div class="teacher-name">Jane Smith</div>
    </div>

</div>

</body>
</html>
