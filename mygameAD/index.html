<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Highway Game+</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #001a33; font-family: Arial; }

  #gameArea {
    position: absolute;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Straße */
  #road {
    position: absolute;
    width: 100%;
    height: 200%;
    background: url('https://i.imgur.com/8z1YQ0U.png');
    background-size: cover;
    animation: moveRoad 3s linear infinite;
  }

  @keyframes moveRoad {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }

  /* Auto */
  #car {
    position: absolute;
    width: 140px;
    bottom: 60px;
    left: calc(50% - 70px);
  }

  /* Polizei */
  #police {
    position: absolute;
    width: 140px;
    bottom: 150px;
    left: calc(50% - 70px);
  }

  /* Steine */
  .stone {
    position: absolute;
    width: 70px;
    height: 70px;
    background: url('https://i.imgur.com/5b7QK7T.png');
    background-size: cover;
  }

  #kmh, #score, #highscore {
    position: absolute;
    color: white;
    font-size: 24px;
    font-weight: bold;
  }

  #kmh { bottom: 20px; right: 20px; }
  #score { top: 20px; left: 20px; }
  #highscore { top: 20px; right: 20px; }

  #gameOver {
    display: none;
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    color: red;
    font-weight: bold;
  }

  /* Explosion */
  #explosion {
    display: none;
    position: absolute;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, #ff0, #f00, #000);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Start-Menü */
  #startMenu {
    position: absolute;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.7);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    z-index: 10;
  }

  #startMenu button, #restartBtn {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 24px;
    cursor: pointer;
  }

  #restartBtn {
    display: none;
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Handy-Steuerung */
  #mobileControls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
  }

  #mobileControls button {
    padding: 10px 20px;
    font-size: 20px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="gameArea">
  <div id="road"></div>

  <img id="car" src="https://i.imgur.com/4fQm2mM.png">
  <img id="police" src="https://i.imgur.com/3uQvZpP.png">

  <div id="kmh">0 KMH</div>
  <div id="score">Score: 0</div>
  <div id="highscore">Highscore: 0</div>
</div>

<div id="explosion"></div>
<div id="gameOver">GAME OVER</div>
<button id="restartBtn">Restart</button>

<div id="startMenu">
  <div>Highway Game+</div>
  <button id="startBtn">Start</button>
</div>

<div id="mobileControls">
  <button id="leftBtn">←</button>
  <button id="nitroBtn">Nitro</button>
  <button id="rightBtn">→</button>
</div>

<audio id="crashSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="nitroSound" src="https://actions.google.com/sounds/v1/transportation/car_accelerate.ogg"></audio>

<script>
const gameArea = document.getElementById("gameArea");
const car = document.getElementById("car");
const police = document.getElementById("police");
const kmhDisplay = document.getElementById("kmh");
const scoreDisplay = document.getElementById("score");
const highscoreDisplay = document.getElementById("highscore");
const gameOverText = document.getElementById("gameOver");
const explosion = document.getElementById("explosion");
const startMenu = document.getElementById("startMenu");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const crashSound = document.getElementById("crashSound");
const nitroSound = document.getElementById("nitroSound");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const nitroBtn = document.getElementById("nitroBtn");

let carX = window.innerWidth / 2 - 70;
let speed = 0;
let score = 0;
let highscore = 0;
let gameRunning = false;
let nitroActive = false;

/* Start */
function startGame() {
  startMenu.style.display = "none";
  restartBtn.style.display = "none";
  gameOverText.style.display = "none";
  explosion.style.display = "none";
  speed = 0;
  score = 0;
  scoreDisplay.textContent = "Score: " + score;
  gameRunning = true;
}

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", startGame);

/* Auto bewegen */
function updateCarPosition() {
  if (carX < 0) carX = 0;
  if (carX > window.innerWidth - 140) carX = window.innerWidth - 140;
  car.style.left = carX + "px";
}

document.addEventListener("keydown", (e) => {
  if (!gameRunning) return;

  if (e.key === "ArrowLeft") carX -= nitroActive ? 45 : 25;
  if (e.key === "ArrowRight") carX += nitroActive ? 45 : 25;
  if (e.key === "Shift") activateNitro();

  updateCarPosition();
});

/* Handy-Steuerung */
leftBtn.addEventListener("click", () => {
  if (!gameRunning) return;
  carX -= nitroActive ? 45 : 25;
  updateCarPosition();
});

rightBtn.addEventListener("click", () => {
  if (!gameRunning) return;
  carX += nitroActive ? 45 : 25;
  updateCarPosition();
});

nitroBtn.addEventListener("click", () => {
  if (!gameRunning) return;
  activateNitro();
});

/* Nitro */
function activateNitro() {
  nitroActive = true;
  nitroSound.play();
  speed += 10;
  setTimeout(() => nitroActive = false, 1500);
}

/* KMH + Score */
setInterval(() => {
  if (!gameRunning) return;
  speed += 1;
  score += 5;
  kmhDisplay.textContent = speed + " KMH";
  scoreDisplay.textContent = "Score: " + score;
  if (score > highscore) {
    highscore = score;
    highscoreDisplay.textContent = "Highscore: " + highscore;
  }
}, 200);

/* Polizei folgt */
setInterval(() => {
  if (!gameRunning) return;
  const policeX = parseFloat(getComputedStyle(police).left);
  const diff = carX - policeX;
  police.style.left = policeX + diff * 0.1 + "px";
}, 50);

/* Steine */
function createStone() {
  if (!gameRunning) return;

  const stone = document.createElement("div");
  stone.classList.add("stone");
  stone.style.left = Math.random() * (window.innerWidth - 70) + "px";
  stone.style.top = "-100px";
  gameArea.appendChild(stone);

  let stoneY = -100;

  const fall = setInterval(() => {
    if (!gameRunning) {
      clearInterval(fall);
      return;
    }

    stoneY += nitroActive ? 18 : 10;
    stone.style.top = stoneY + "px";

    const carRect = car.getBoundingClientRect();
    const policeRect = police.getBoundingClientRect();
    const stoneRect = stone.getBoundingClientRect();

    /* Crash mit Stein */
    if (
      carRect.left < stoneRect.right &&
      carRect.right > stoneRect.left &&
      carRect.top < stoneRect.bottom &&
      carRect.bottom > stoneRect.top
    ) {
      gameOver(stoneRect);
      clearInterval(fall);
    }

    /* Polizei erwischt dich */
    if (
      carRect.left < policeRect.right &&
      carRect.right > policeRect.left &&
      carRect.top < policeRect.bottom &&
      carRect.bottom > policeRect.top
    ) {
      gameOver(policeRect);
      clearInterval(fall);
    }

    if (stoneY > window.innerHeight) {
      stone.remove();
      clearInterval(fall);
    }
  }, 30);
}

setInterval(createStone, 900);

/* Game Over + Explosion */
function gameOver(rect) {
  gameRunning = false;
  gameOverText.style.display = "block";
  restartBtn.style.display = "block";

  crashSound.play();

  explosion.style.display = "block";
  explosion.style.left = rect.left - 50 + "px";
  explosion.style.top = rect.top - 50 + "px";
}
</script>

</body>
</html>
