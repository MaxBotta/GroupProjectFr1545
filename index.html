<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <main>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      
      <div class="footer-top">
        <div class="footer-logo">
          <img src="images/logo.png" alt="MOOC Logo">
        </div>
        <div class="footer-newsletter">
          <form action="#" method="POST" class="newsletter-form" id="newsletterForm">
            <input type="email" placeholder="Enter your email to get the latest news..." required class="newsletter-input">
            <button type="submit" class="newsletter-btn">Subscribe</button>
          </form>
          <div id="successMessage" class="newsletter-success">
            Abonnieren war erfolgreich! Gut gemacht! 🎉
          </div>
        </div>
      </div>

      <div class="footer-content">
        <div class="footer-column">
          <h3>Beliebte Kurse</h3>
          <ul>
            <li><a href="#">Python</a></li>
            <li><a href="#">HTML</a></li>
            <li><a href="#">CSS</a></li>
            <li><a href="#">JavaScript</a></li>
          </ul>
        </div>
        
        <div class="footer-column">
          <h3>Themengebiete</h3>
          <ul>
            <li><a href="#">Informatik</a></li>
            <li><a href="#">Mathe</a></li>
            <li><a href="#">Physik</a></li>
            <li><a href="#">Biologie</a></li>
          </ul>
        </div>

        <div class="footer-column">
          <h3>Links</h3>
          <ul>
            <li><a href="index.html">Kurse</a></li>
            <li><a href="calendar.html">Kalender</a></li>
            <li><a href="#">Kontakt</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <div class="copyright">
          <p>Companyname @ 2026. All rights reserved.</p>
        </div>
        <div class="footer-legal">
          <a href="#">Datenschutz</a>
          <a href="#">Impressum</a>
        </div>
      </div>

    </div>
  </footer>

  <script>
    document.getElementById('newsletterForm').addEventListener('submit', function(event) {
      event.preventDefault(); 
      
      var msg = document.getElementById('successMessage');
      
      msg.style.display = 'block';
      msg.style.opacity = '1';
      
      this.reset();
      
      setTimeout(function() {
        msg.style.transition = 'opacity 0.5s ease';
        msg.style.opacity = '0';
        
        setTimeout(function() {
          msg.style.display = 'none';
        }, 500);
      }, 5000);
    });
  </script>

</body>
</html>
